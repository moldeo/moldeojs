<?xml version="1.0" encoding="ISO-8859-1" ?>
<MOCONFIG majorversion="0" minorversion="0">
    <DEFINITION name="image" class="image" />
    <UPDATE />
    <CONFIGPARAMS>
        <PARAM name="inlet" type="INLET" />
        <PARAM name="outlet" type="OUTLET" />
        <PARAM name="script" type="SCRIPT">
            <VAL>
                <D type="TXT"></D>
            </VAL>
        </PARAM>
        <PARAM name="alpha" type="ALPHA" property="published">
            <VAL>
                <D type="FUNCTION">0.86+0.08*sin(seconds*0.31*escena.ritmo)</D>
            </VAL>
        </PARAM>
        <PARAM name="color" type="COLOR" property="published">
            <VAL>
                <D type="FUNCTION" code="RED">1.0</D>
                <D type="FUNCTION" code="GREEN">1.0</D>
                <D type="FUNCTION" code="BLUE">1.0</D>
                <D type="FUNCTION" code="ALPHA">1.0</D>
            </VAL>
        </PARAM>
        <PARAM name="syncro" type="SYNC">
            <VAL>
                <D type="FUNCTION">1.0</D>
            </VAL>
        </PARAM>
        <PARAM name="phase" type="PHASE">
            <VAL>
                <D type="FUNCTION">0.0</D>
            </VAL>
        </PARAM>
        <PARAM name="texture" type="TEXTURE">
            <VAL>
                <D type="TXT">capa_07_niebla.png</D>
            </VAL>
        </PARAM>
        <PARAM name="blending" type="BLENDING">
            <VAL>
                <D type="NUM">0</D>
            </VAL>
        </PARAM>
        <PARAM name="pos_text_x" type="FUNCTION" property="published">
            <VAL>
                <D type="FUNCTION">0.0</D>
            </VAL>
        </PARAM>
        <PARAM name="pos_text_y" type="FUNCTION" property="published">
            <VAL>
                <D type="FUNCTION">0.0</D>
            </VAL>
        </PARAM>
        <PARAM name="anc_text_x" type="FUNCTION" property="published">
            <VAL>
                <D type="FUNCTION">1.0</D>
            </VAL>
        </PARAM>
        <PARAM name="alt_text_y" type="FUNCTION" property="published">
            <VAL>
                <D type="FUNCTION">1.0</D>
            </VAL>
        </PARAM>
        <PARAM name="pos_cuad_x" type="FUNCTION" property="published">
            <VAL>
                <D type="FUNCTION">-(mousex-0.5)*2*escena.parallax*niebla.profundidad+0.02*sin(seconds*0.2*escena.ritmo)</D>
            </VAL>
            <VAL>
                <D type="FUNCTION">escena.respira*niebla.profundidad*sin(seconds*0.21+7)</D>
            </VAL>
            <VAL>
                <D type="FUNCTION">0.0</D>
            </VAL>
        </PARAM>
        <PARAM name="pos_cuad_y" type="FUNCTION" property="published">
            <VAL>
                <D type="FUNCTION">(mousey-0.5)*escena.parallax*escena.parallax_y*niebla.profundidad+0.006*sin(seconds*0.27*escena.ritmo+1)</D>
            </VAL>
            <VAL>
                <D type="FUNCTION">escena.respira*0.5*niebla.profundidad*cos(seconds*0.17+7)</D>
            </VAL>
            <VAL>
                <D type="FUNCTION">0.0</D>
            </VAL>
        </PARAM>
        <PARAM name="anc_cuad_x" type="FUNCTION" property="published">
            <VAL>
                <D type="FUNCTION">1+2.4*escena.parallax*niebla.profundidad</D>
            </VAL>
            <VAL>
                <D type="FUNCTION">1+2.4*escena.respira*niebla.profundidad</D>
            </VAL>
            <VAL>
                <D type="FUNCTION">1.0</D>
            </VAL>
        </PARAM>
        <PARAM name="alt_cuad_y" type="FUNCTION" property="published">
            <VAL>
                <D type="FUNCTION">1+2.4*escena.parallax*niebla.profundidad</D>
            </VAL>
            <VAL>
                <D type="FUNCTION">1+2.4*escena.respira*niebla.profundidad</D>
            </VAL>
            <VAL>
                <D type="FUNCTION">1.0</D>
            </VAL>
        </PARAM>
        <PARAM name="profundidad" type="FUNCTION" property="published">
            <VAL>
                <D type="FUNCTION">0.0200</D>
            </VAL>
        </PARAM>
        <PARAM name="ajuste" type="FUNCTION">
            <VAL>
                <D type="FUNCTION">1</D>
            </VAL>
        </PARAM>
        <PARAM name="ancla_x" type="FUNCTION">
            <VAL>
                <D type="FUNCTION">escena.ancla_x</D>
            </VAL>
        </PARAM>
        <PARAM name="ancla_y" type="FUNCTION">
            <VAL>
                <D type="FUNCTION">escena.ancla_y</D>
            </VAL>
        </PARAM>
    </CONFIGPARAMS>
    <PRECONFIGS>
        <PRE name="parallax">
            <P name="pos_cuad_x">0</P>
            <P name="pos_cuad_y">0</P>
            <P name="anc_cuad_x">0</P>
            <P name="alt_cuad_y">0</P>
        </PRE>
        <PRE name="respira">
            <P name="pos_cuad_x">1</P>
            <P name="pos_cuad_y">1</P>
            <P name="anc_cuad_x">1</P>
            <P name="alt_cuad_y">1</P>
        </PRE>
        <PRE name="quieto">
            <P name="pos_cuad_x">2</P>
            <P name="pos_cuad_y">2</P>
            <P name="anc_cuad_x">2</P>
            <P name="alt_cuad_y">2</P>
        </PRE>
    </PRECONFIGS>
</MOCONFIG>
