<div #moCanvas id="moCanvas"   [class.hideme]="moEditDisplay==false" [class.showme]="moEditDisplay==true" [style.display]="(moEditDisplay && graphView) ? '' : 'none'" (mouseenter)="moWheelDisplay=false;"></div>

<div #moWheel id="moWheel" [hidden]="!moWheelDisplay">
  <div class="circle moWheelAni"></div>
  <div class="objectSelect selectAni">
    <div *ngFor="let type of PluginsDefinitionsMapTypes">
      <h3>{{moMoldeoObjectTypeToText[type]}}</h3>
      <li *ngFor="let mob of PluginsDefinitionsMapTypeArray[type]" name="mob" class="mob.m_Name" (click)="createMOObject(mob)">
        {{mob.m_Name}}:{{mob.m_MoldeoObjectType}}
      </li>
    </div>
  </div>
</div>

<!--
<div id="moControl" #moControl (mouseenter)="moWheelDisplay=false;"  [class.hideme]="moControlDisplay==false" [class.showme]="moControlDisplay==true">
  <h1>CONTROL</h1>
</div>
-->
<mo-control
  id="moControl"
  #moControl
  [class.hideme]="moControlDisplay==false" [class.showme]="moControlDisplay==true"
  >
</mo-control>

<div id="moConfig" #moConfig (mouseenter)="moWheelDisplay=false;" [class.hideme]="moEditDisplay==false" [class.showme]="moEditDisplay==true" [style.display]="(moEditDisplay && graphView) ? '' : 'none'">
</div>



<!-- UI-R (FCA 18-nov): el menú de arriba se fue. Barra flotante abajo al centro = deshacer · rehacer · EDIT;
     el resto (nombre, escena, guardar, versiones, persona, control, auto, log) vive en la rueda del proyecto (abajo der., ◈)
     y en su FICHA (.moProyecto), que se ve mientras la rueda muestra la cara «proyecto». -->
<div class="moBar" data-html2canvas-ignore role="toolbar" aria-label="Deshacer, rehacer y modo edición">
  <span *ngIf="undoLabel" class="moBarLabel" aria-live="polite">{{ undoLabel }}</span>
  <button class="moBarB" type="button" name="undo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer" [disabled]="!history.canUndo()" (click)="doUndo()">↶</button>
  <button class="moBarB" type="button" name="redo" title="Rehacer (Ctrl+Shift+Z)" aria-label="Rehacer" [disabled]="!history.canRedo()" (click)="doRedo()">↷</button>
  <button class="moBarEdit" [class.moEditing]="moEditDisplay" type="button" name="moButton" (click)="showmoEditView();" [title]="moEditDisplay ? 'Editando: tocá y mové los objetos (clic para salir)' : 'Entrar en modo edición'">{{ moEditDisplay ? 'Editando' : 'EDIT' }}</button>
</div>

<div *ngIf="proyectoView" class="moProyecto" data-html2canvas-ignore>
  <div class="moProyName" *ngIf="!renaming" (click)="startRename()" title="Tocar para renombrar el proyecto">
    <span class="moProyNameTxt">{{ moFileName }}</span><span class="moProyPen">✎</span>
  </div>
  <input *ngIf="renaming" #renameInput class="moProyInput" name="projectName" type="text" [value]="renameDraft"
    (input)="renameDraft = $event.target.value" (keydown.enter)="confirmRename()" (keydown.escape)="cancelRename()" (blur)="confirmRename()"
    aria-label="Nombre del proyecto">
  <div *ngIf="saveState" class="moProyMsg">{{ saveState }}</div>
  <div *ngIf="personaMsg" class="moProyMsg">{{ personaMsg }}</div>

  <div *ngIf="fichaSec == 'escena' && escenaFx" class="moEscena" title="Parámetros del proyecto (MOB escena): valen para todas las capas">
    <label *ngFor="let n of escenaKeys()"><span>{{ n }}</span>
      <input type="range" min="0" max="2" step="0.05" [value]="escenaVals[n]" (pointerdown)="setEscena(n, escenaVals[n], true)" (input)="setEscena(n, $event.target.value)" [attr.name]="'escena_' + n">
      <b>{{ escenaVals[n] | number:'1.2-2' }}</b></label>
  </div>

  <div *ngIf="fichaSec == 'persona' && personas.length" class="moProySec">
    <select class="moPersona" name="persona" title="La carta de una persona mueve el sol y la luna" [value]="personaId" (change)="choosePersona($event.target.value)">
      <option value="">Persona…</option>
      <option *ngFor="let p of personas" [value]="p.id">{{ p.alias }} · {{ p.id }}</option>
    </select>
  </div>

  <div *ngIf="fichaSec == 'versiones'" class="moVersions">
    <div class="moVersionsHead">Versiones <span class="moVersionsClose" (click)="toggleSec('versiones')">✕</span></div>
    <div *ngIf="versionsMsg" class="moVersionsMsg">{{ versionsMsg }}</div>
    <div *ngFor="let v of versions" class="moVersionRow">
      <span class="moVersionNum">v{{ v.number }}</span>
      <span class="moVersionInfo">{{ versionDate(v.date) }} · {{ v.user }}<br/><i>{{ v.note }}</i></span>
      <button class="moldeobutton" type="button" (click)="restoreVersion(v)">Restaurar</button>
    </div>
  </div>
</div>
